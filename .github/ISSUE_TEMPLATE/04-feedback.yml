name: "✨ General Feedback"
description: "Share your experience, what works well, or what could be clearer."
title: "[Feedback] "

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ How has your experience been?

        We'd love to hear what works well and what could feel better.
        Only **What would you like to share?** is required.
        For a specific problem or new feature, you can also use Bug Report or Feature Request.

  - type: textarea
    id: feedback
    attributes:
      label: "💬 What would you like to share?"
      description: "Tell us about your experience in your own words."
      placeholder: "Example: The menu has everything I need, but I find it hard to locate the option I use most."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🌱 Optional details
        Positive feedback, frustrations, and suggestions are all welcome.

  - type: dropdown
    id: category
    attributes:
      label: "🧩 What kind of feedback is this?"
      options:
        - "Something I like"
        - "Usability or accessibility"
        - "Appearance or wording"
        - "Overall experience"
        - "Other / Not sure"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "🧭 When did you notice this?"
      description: "Describe what you were trying to do or which part of the project this concerns."
      placeholder: "Example: I noticed this while looking for an option in the settings."
    validations:
      required: false

  - type: textarea
    id: improvement
    attributes:
      label: "💡 What would make the experience better?"
      description: "If you have a suggestion, share it. It's also fine just to describe how it felt."
      placeholder: "Example: Grouping related options together would make them easier to find."
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: "📎 Examples or extra thoughts"
      description: "Drag and drop or paste images and files here, use the attachment button, or add links and details."
      placeholder: "Add a screenshot or any other context you'd like to share."
    validations:
      required: false

  - type: markdown
    attributes:
      value: "💙 Thank you! Hearing about your experience helps us decide what to improve."
