name: "💡 Feature Request"
description: "Suggest a new feature or a change to an existing one."
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Got an idea?

        Small improvements and new ideas are welcome!
        You don't need to explain how to build it. Only **What would you like to add or change?** is required.

  - type: textarea
    id: idea
    attributes:
      label: "💡 What would you like to add or change?"
      description: "Describe your idea in your own words."
      placeholder: "Example: I'd like an option to make text larger."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🎨 Optional details
        Add whatever helps explain your idea.

  - type: textarea
    id: benefit
    attributes:
      label: "❤️ Why would this be useful?"
      description: "What problem would this solve, and who would it help?"
      placeholder: "Example: Larger text would make the interface easier to read on a small screen."
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: "🧩 What kind of idea is this?"
      options:
        - "Something new"
        - "Improve an existing feature"
        - "Make something easier to use"
        - "More customization or options"
        - "Other / Not sure"
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: "✨ How do you imagine it working?"
      description: "Describe an example of using it or what a useful result would look like."
      placeholder: "Example: A text-size setting could offer small, medium, and large options."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Have you tried another approach?"
      description: "Share any workaround or alternative you've considered."
      placeholder: "Example: Zooming in helps, but some controls no longer fit on the screen."
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: "📸 Pictures or examples"
      description: "Drag and drop or paste images and files here, use the attachment button, or add a link."
      placeholder: "A sketch, screenshot, or example from another project can help."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "💬 Anything else?"
      description: "Add any other thoughts or useful context."
      placeholder: "Feel free to share anything else about your idea."
    validations:
      required: false

  - type: markdown
    attributes:
      value: "💙 Thanks for sharing! Every suggestion helps us understand what people need."
