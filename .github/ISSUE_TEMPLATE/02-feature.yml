
name: "💡 Feature Request"
description: "Have an idea? Suggest it here!"
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Got an idea?

        I'd love to hear it! ❤️

        Whether it's a small improvement or a
        completely new feature, feel free to suggest it.

        > 💡 You don't need to explain how to build it.
        > Just tell me what you'd like to see!

        ---

        ### ✨ Tell me about your idea

  - type: textarea
    id: idea
    attributes:
      label: "💡 What would you like to add or change?"
      description: "Explain your idea in your own words."
      placeholder: |
        Example: It would be nice if residents
        could have different jobs.

        All ideas are welcome!
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: "❤️ Why would this be useful?"
      description: "What would this improve or make easier?"
      placeholder: |
        Example: It would make towns feel more
        alive and interesting.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### 🎨 Extra details
        Everything below is **optional**.

  - type: dropdown
    id: category
    attributes:
      label: "🧩 What kind of idea is this?"
      options:
        - "Something completely new"
        - "Improve an existing feature"
        - "Make something easier to use"
        - "More customization or options"
        - "Other / Not sure"
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: "🎮 How do you imagine it working?"
      description: "If you have an example, share it!"
      placeholder: |
        Example: When registering a house,
        I could select which jobs the residents have.
    validations:
      required: false

  - type: upload
    id: references
    attributes:
      label: "📸 Pictures or examples"
      description: "Have a screenshot, drawing or other example? Add it here!"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### 💙 Thanks for sharing!

        Every suggestion is appreciated.
        Not every idea will be implemented,
        but they're all useful to consider!
